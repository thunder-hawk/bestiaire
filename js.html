<script>
let currentCategory = 'all';

function filterCreatures() {
  const searchInput = document.getElementById('searchBar').value.toLowerCase();
  const cards = document.querySelectorAll('.creature-card');

  cards.forEach(card => {
    const name = card.querySelector('.creature-name').innerText.toLowerCase();
    const desc = card.querySelector('.creature-desc').innerText.toLowerCase();
    const category = card.getAttribute('data-category');

    const matchesSearch = name.includes(searchInput) || desc.includes(searchInput);
    const matchesCategory = (currentCategory === 'all' || category === currentCategory);

    if (matchesSearch && matchesCategory) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }
  });
}

function filterCategory(category, button) {
  currentCategory = category;
  
  // Gestion de la classe active sur les boutons
  document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
  button.classList.add('active');

  // Mise à jour de l'affichage
  filterCreatures();
}
</script>
